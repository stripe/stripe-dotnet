name: Test
description: Build the test project for one target framework, start stripe-mock, then run the tests. Shared by CI and Canary CI; expects the repository to be checked out.

inputs:
  framework:
    description: Target framework moniker to test, e.g. net8.0 or net462.
    required: true
  latest-dotnet-version:
    description: Latest supported .NET version, from the prepare action.
    required: true
  canary_channel:
    description: >-
      Canary channel (ga, beta, or private-preview) whose specs and fixtures
      stripe-mock should serve. Empty uses the OPENAPI_VERSION release.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
    - name: Resolve stripe-mock OpenAPI inputs
      id: openapi
      shell: bash
      env:
        CANARY_CHANNEL: ${{ inputs.canary_channel }}
      run: |
        set -euo pipefail

        if [[ -z "$CANARY_CHANNEL" ]]; then
          echo "version=$(< OPENAPI_VERSION)" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        case "$CANARY_CHANNEL" in
          ga)
            spec_name=spec3.sdk.json
            fixtures_name=fixtures3.json
            beta=false
            ;;
          beta)
            spec_name=spec3.beta.sdk.json
            fixtures_name=fixtures3.beta.json
            beta=true
            ;;
          private-preview)
            spec_name=spec3.private_preview.sdk.json
            fixtures_name=fixtures3.private_preview.json
            beta=true
            ;;
          *)
            echo "::error::Unsupported canary channel: $CANARY_CHANNEL"
            exit 1
            ;;
        esac

        canary_dir="$GITHUB_WORKSPACE/.stripe-mock-canary"
        mkdir -p "$canary_dir"

        spec_path="$canary_dir/$spec_name"
        fixtures_path="$canary_dir/$fixtures_name"
        canary_base="https://raw.githubusercontent.com/stripe/openapi/master/openapi/canary/$CANARY_CHANNEL"
        curl_options=(
          --retry 3
          --retry-all-errors
          --fail
          --silent
          --show-error
        )

        curl "${curl_options[@]}" "$canary_base/$spec_name" -o "$spec_path"
        curl "${curl_options[@]}" "$canary_base/$fixtures_name" -o "$fixtures_path"

        {
          echo "spec_path=$spec_path"
          echo "fixtures_path=$fixtures_path"
          echo "beta=$beta"
        } >> "$GITHUB_OUTPUT"

    - name: Setup .NET (latest SDK)
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: "${{ inputs.latest-dotnet-version }}.x"

    # .NET Framework (net462) runs on the Windows runner's preinstalled framework,
    # so only the ubuntu frameworks need a runtime installed.
    - name: Install target framework runtime
      if: runner.os != 'Windows'
      shell: bash
      run: |
        channel="${MATRIX_FRAMEWORK}"
        channel="${channel#net}"
        if [ "$channel" != "${LATEST_DOTNET_VERSION}" ]; then
          ./scripts/dotnet-install.sh --runtime dotnet --channel "$channel" --install-dir "$DOTNET_ROOT"
        fi
      env:
        MATRIX_FRAMEWORK: ${{ inputs.framework }}
        LATEST_DOTNET_VERSION: ${{ inputs.latest-dotnet-version }}

    # The Windows steps keep PowerShell, the default shell the net462 job used
    # before these steps moved into this action.
    - name: Install tools
      if: runner.os != 'Windows'
      shell: bash
      run: dotnet tool restore
    - name: Install tools
      if: runner.os == 'Windows'
      shell: pwsh
      run: dotnet tool restore

    - name: Build
      if: runner.os != 'Windows'
      shell: bash
      run: |
        echo "Building ${MATRIX_FRAMEWORK} using dotnet v$(dotnet --version)"
        dotnet build src/StripeTests/StripeTests.csproj -c Release -f ${MATRIX_FRAMEWORK} /p:ContinuousIntegrationBuild=true
      env:
        MATRIX_FRAMEWORK: ${{ inputs.framework }}
    - name: Build
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        echo "Building $env:MATRIX_FRAMEWORK using dotnet v$(dotnet --version)"
        dotnet build src/StripeTests/StripeTests.csproj -c Release -f $env:MATRIX_FRAMEWORK /p:ContinuousIntegrationBuild=true
      env:
        MATRIX_FRAMEWORK: ${{ inputs.framework }}

    - uses: stripe/openapi/actions/stripe-mock@master
      with:
        openapi_version: ${{ steps.openapi.outputs.version }}
        spec_path: ${{ steps.openapi.outputs.spec_path }}
        fixtures: ${{ steps.openapi.outputs.fixtures_path }}
        beta: ${{ steps.openapi.outputs.beta }}

    - name: Run tests
      if: runner.os != 'Windows'
      shell: bash
      run: dotnet test --no-build -f ${MATRIX_FRAMEWORK} src/StripeTests/StripeTests.csproj -c Release
      env:
        MATRIX_FRAMEWORK: ${{ inputs.framework }}
    - name: Run tests
      if: runner.os == 'Windows'
      shell: pwsh
      run: dotnet test --no-build --configuration Release --framework $env:MATRIX_FRAMEWORK src/StripeTests/StripeTests.csproj
      env:
        MATRIX_FRAMEWORK: ${{ inputs.framework }}
