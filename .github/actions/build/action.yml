name: Build
description: Build the Stripe.net library in Release. Shared by CI and Canary CI; expects the repository to be checked out.

inputs:
  latest-dotnet-version:
    description: Latest supported .NET version, from the prepare action.
    required: true

runs:
  using: composite
  steps:
    - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: "${{ inputs.latest-dotnet-version }}.x"
    - name: Install tools
      shell: bash
      run: dotnet tool restore
    - name: Build Release
      shell: bash
      run: dotnet build src/Stripe.net -c Release /p:ContinuousIntegrationBuild=true
